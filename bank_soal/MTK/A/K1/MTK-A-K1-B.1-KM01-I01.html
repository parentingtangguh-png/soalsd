const app=document.getElementById('app'); const indicator=document.getElementById('indicator'); let mode='inspect'; let kind='DIA'; let index=0; let reviewAll=false; const answers={};
 const labels={DIA:'Diagnostik',PGT:'Penguatan',PYN:'Pengayaan',CU:'Cek Ulang'};
 function hierarchy(){const h=DATA.hierarki||{}; return '<section class="card"><h2>Hierarki CP–ATP–TP–KM–Indikator</h2>'+['CP','ATP','TP','KM','Indikator'].map(k=>'<p><b>'+k+':</b> '+esc(h[k]||DATA.id_indikator||'Belum tersedia')+'</p>').join('')+'</section>';}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function currentQuestions(){return (DATA.soal||[]).filter(q=>q.jenis_soal===kind);}
function questionAudit(q){const h=DATA.hierarki||{}; return '<details open class="audit"><summary>Audit atribut soal</summary><p><b>Kategori kecakapan berpikir:</b> '+esc(h.kategori||'Belum tersedia')+'</p><dl>'+Object.entries(q).map(([k,v])=>'<dt><b>'+esc(k)+'</b></dt><dd>'+esc(typeof v==='object'?JSON.stringify(v):v)+'</dd>').join('')+'</dl></details>';}
function renderWorkAll(){const qs=currentQuestions(); indicator.textContent='Indikator: '+(DATA.id_indikator||''); app.innerHTML='<h2>Tampilan Pengajuan — seluruh soal</h2><p class="muted">Semua '+qs.length+' soal '+esc(labels[kind])+' ditampilkan untuk ditinjau sebelum persetujuan.</p><button id="singleMode">Kembali ke tampilan satu per satu</button>'+qs.map(q=>'<section class="card"><h3>'+esc(q.id_soal)+'</h3><p>'+esc(q.pertanyaan)+'</p>'+(IMAGES[q.id_soal]?'<figure class="stimulus"><figcaption>Stimulus</figcaption><img alt="Stimulus soal" src="'+IMAGES[q.id_soal]+'"></figure>':'')+(q.metode_penilaian==='OTOMATIS'?'<p><b>Pilihan jawaban:</b> '+esc(JSON.stringify(q.pilihan||null))+'</p><p><b>Kunci jawaban:</b> '+esc(q.kunci_jawaban||'null')+'</p>':'<p><b>Rubrik pemeriksaan:</b> '+esc(JSON.stringify(q.rubrik_penilaian||null))+'</p>')+questionAudit(q)+'</section>').join(''); document.getElementById('singleMode').onclick=()=>{reviewAll=false;index=0;renderWork();};}
 function renderInspect(){indicator.textContent='Indikator: '+(DATA.id_indikator||''); app.innerHTML='<h2>Mode Pemeriksaan</h2>'+hierarchy()+((DATA.soal||[]).map(q=>'<section class="card"><h3>'+esc(q.id_soal)+' — '+esc(labels[q.jenis_soal])+'</h3><dl>'+Object.entries(q).map(([k,v])=>'<dt><b>'+esc(k)+'</b></dt><dd>'+esc(typeof v==='object'?JSON.stringify(v):v)+'</dd>').join('')+'</dl>'+(IMAGES[q.id_soal]?'<figure class="stimulus"><figcaption>Stimulus</figcaption><img alt="Stimulus soal" src="'+IMAGES[q.id_soal]+'"></figure>':'')+'</section>').join('')||'<p>Belum ada soal.</p>');}
function renderWork(){if(reviewAll){renderWorkAll();return;} const qs=currentQuestions(); const q=qs[index]; indicator.textContent='Indikator: '+(DATA.id_indikator||''); if(!q){app.innerHTML='<p>Kelompok '+esc(kind)+' belum tersedia.</p>';return;} let input=''; if(q.metode_penilaian==='OTOMATIS') input=Object.entries(q.pilihan||{}).map(([k,v])=>'<label class="choice"><input type="radio" name="answer" value="'+k+'" '+(answers[q.id_soal]===k?'checked':'')+'> '+k+'. '+esc(v)+'</label>').join(''); else input=Array.isArray(q.rubrik_penilaian)?q.rubrik_penilaian.map((v,i)=>'<label class="choice"><input type="checkbox" data-rubrik="'+i+'" '+((answers[q.id_soal]||[]).includes(i)?'checked':'')+'> '+esc(typeof v==='object'?v.kriteria:v)+'</label>').join(''):'<p>Rubrik belum tersedia.</p>'; app.innerHTML='<label>Jenis: <select id="kind">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'" '+(k===kind?'selected':'')+'>'+v+'</option>').join('')+'</select></label><button id="all">Tampilkan semua soal</button><section class="card"><h2>'+esc(q.id_soal)+'</h2><p>'+esc(q.pertanyaan)+'</p>'+(IMAGES[q.id_soal]?'<figure class="stimulus"><figcaption>Stimulus</figcaption><img alt="Stimulus soal" src="'+IMAGES[q.id_soal]+'"></figure>':'')+'<div>'+input+'</div><p class="muted">Soal '+(index+1)+' dari '+qs.length+'</p><button id="save">Simpan respons</button><button id="next">Berikutnya</button><button id="report">Nilai kelompok</button><div id="result"></div></section>'; document.getElementById('kind').onchange=e=>{kind=e.target.value;index=0;renderWork();}; document.getElementById('all').onclick=()=>{reviewAll=true;renderWorkAll();}; document.getElementById('save').onclick=()=>save(q); document.getElementById('next').onclick=()=>{save(q);index=Math.min(index+1,qs.length-1);renderWork();}; document.getElementById('report').onclick=()=>report(qs);}
function save(q){if(q.metode_penilaian==='OTOMATIS'){const el=document.querySelector('input[name=answer]:checked'); if(el)answers[q.id_soal]=el.value;}else answers[q.id_soal]=[...document.querySelectorAll('input[data-rubrik]:checked')].map(x=>Number(x.dataset.rubrik));}
function score(q){const a=answers[q.id_soal]; if(a===undefined)return null; if(q.metode_penilaian==='OTOMATIS')return a===q.kunci_jawaban?100:0; return Math.round((a.length/(q.rubrik_penilaian||[]).length)*10000)/100;}
function report(qs){const scores=qs.map(score); const complete=scores.every(v=>v!==null); const avg=complete?scores.reduce((a,b)=>a+b,0)/scores.length:null; let next=''; if(kind==='DIA'&&avg!==null)next=avg===100?'PYN':'PGT'; else if((kind==='PGT'||kind==='PYN')&&complete)next='CU'; const status=kind==='CU'&&avg!==null?(avg===100?'Tuntas':'Belum Tuntas'):''; document.getElementById('result').innerHTML='<div class="card"><b>Laporan</b><p>Terjawab: '+scores.filter(v=>v!==null).length+'/'+scores.length+'</p><p>Nilai: '+(avg===null?'belum lengkap':avg.toFixed(2)+'%')+'</p><p>'+esc(status|| (next?'Kelompok berikutnya: '+labels[next]:'Lengkapi seluruh soal untuk laporan'))+'</p></div>';}
document.getElementById('inspectBtn').onclick=()=>{mode='inspect';renderInspect();}; document.getElementById('workBtn').onclick=()=>{mode='work';reviewAll=true;renderWork();}; renderInspect();</script></body></html>
